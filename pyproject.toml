[project]
name = "canopus-dsl"
version = "0.2.0"
description = "Canopus DSL - The DSL for ML pipelines pattern matching"
readme = "README.md"
authors = [
    { name = "Nicolas Lacroix", email = "nicolas.lacroix@univ-cotedazur.fr" }
]
requires-python = "==3.10.*"
dependencies = [
    "antlr4-python3-runtime>=4.13.2",
    "antlr4-tools>=0.2.2",
    "pydantic>=2.12.4",
    "types-antlr4-python3-runtime>=4.13.0.20260807",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pyrefly==1.5.0",
    "ruff==0.17.6",
    "coverage==7.16.2",
    "bandit[toml]==1.9.4",
    "vulture==2.16",
    "prek==0.5.11",
    "commitizen>=4.20.1",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.pyrefly]
project-includes = [
    "src/*.py",
]

[tool.ruff]
exclude = ["src/canopus_dsl/generated"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.vulture]
min_confidence = 70
sort_by_size = true
paths = ["src/"]
exclude = ["src/canopus_dsl/generated/"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
update_changelog_on_bump = true
changelog_incremental = true
